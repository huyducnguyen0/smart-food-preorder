# Hai cách dùng (biến lấy từ file .env cùng thư mục, copy từ .env.example):
#   docker compose up -d --wait                         chỉ PostgreSQL; backend, frontend chạy trực tiếp trên máy (phát triển)
#   docker compose --profile app up -d --build --wait   toàn bộ hệ thống trong container; mở http://localhost:${APP_PORT}
name: smart-food-preorder

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Thiếu DB_NAME - copy .env.example thành .env}
      POSTGRES_USER: ${DB_USER:?Thiếu DB_USER - copy .env.example thành .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD - copy .env.example thành .env}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      # Cổng máy host lấy từ DB_PORT; cổng trong container luôn là 5432.
      - "${DB_PORT:-5433}:5432"
    volumes:
      # Từ image 18, dữ liệu nằm trong thư mục con theo phiên bản (/var/lib/postgresql/18/docker),
      # nên gắn volume vào /var/lib/postgresql, không phải /var/lib/postgresql/data như bản 17 trở về trước.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: [app]
    build: ./backend
    environment:
      # Trong mạng của compose, backend gọi database bằng tên dịch vụ "db" và cổng trong container.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      BACKEND_PORT: 8080
      # Mặc định có dữ liệu mẫu để demo; triển khai thật đặt FLYWAY_LOCATIONS=classpath:db/migration (bỏ db/seed).
      SPRING_FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/seed}
      # Quản lý đầu tiên (BR-32), chỉ tạo khi database chưa có quản lý; cần khi bỏ dữ liệu mẫu.
      INITIAL_MANAGER_LOGIN_ID: ${INITIAL_MANAGER_LOGIN_ID:-}
      INITIAL_MANAGER_PASSWORD: ${INITIAL_MANAGER_PASSWORD:-}
      INITIAL_MANAGER_NAME: ${INITIAL_MANAGER_NAME:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Image JRE không có curl; dùng bash (sh không hỗ trợ /dev/tcp) mở kết nối tới cổng 8080 và gọi /api/health.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8080 &&
          printf 'GET /api/health HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '"status":"UP"' <&3
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  frontend:
    profiles: [app]
    build: ./frontend
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
