spring:
  application:
    name: preorder-backend
  config:
    # Đọc biến môi trường từ 03-SourceCodes/.env (cùng file Docker Compose dùng).
    # Đường dẫn tính từ thư mục chạy lệnh, tức backend/.
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:preorder}
    username: ${DB_USER:preorder}
    password: ${DB_PASSWORD}
  # Không để Spring Security tự tạo người dùng mặc định với mật khẩu ngẫu nhiên; tài khoản lấy từ bảng user_accounts.
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  flyway:
    # db/migration: cấu trúc bảng (mọi môi trường). db/seed: dữ liệu mẫu cho local và demo (migration lặp R__);
    # bỏ db/seed khỏi danh sách này khi triển khai công khai.
    locations: classpath:db/migration,classpath:db/seed

server:
  port: ${BACKEND_PORT:8080}
  servlet:
    session:
      # Phiên hết hạn sau 30 phút không hoạt động (Architecture mục 3); cookie không đọc được bằng JavaScript.
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

app:
  # Ràng buộc SRS mục D: thời gian theo múi giờ cửa hàng (UTC+7).
  time-zone: Asia/Ho_Chi_Minh
  # Các con số nghiệp vụ cấu hình được nhưng không đổi khi vận hành (SRS B.4); giờ mở cửa và quota nằm trong database.
  ordering:
    slot-minutes: 15
    min-lead-minutes: 30
    prep-window-minutes: 15
    max-open-orders-per-customer: 3
