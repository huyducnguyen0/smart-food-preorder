spring:
  application:
    name: preorder-backend
  config:
    # Đọc biến môi trường từ 03-SourceCodes/.env (cùng file Docker Compose dùng).
    # Đường dẫn tính từ thư mục chạy lệnh, tức backend/.
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:preorder}
    username: ${DB_USER:preorder}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration

server:
  port: ${BACKEND_PORT:8080}

app:
  # Ràng buộc SRS mục D: thời gian theo múi giờ cửa hàng (UTC+7).
  time-zone: Asia/Ho_Chi_Minh
