# nginx trong image frontend (xem Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API: chuyển tiếp sang container backend, giữ nguyên cookie và header.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File có mã băm trong tên (do Vite sinh) không bao giờ đổi nội dung nên cho trình duyệt lưu lâu.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ứng dụng một trang: mọi đường dẫn khác (/orders/2, /admin...) trả index.html để React Router xử lý.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
