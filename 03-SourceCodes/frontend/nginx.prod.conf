# Caddy là proxy công khai duy nhất. Nó tự đặt X-Forwarded-For và bỏ giá trị do client gửi.
map $http_x_forwarded_for $client_address {
    ""      $remote_addr;
    default $http_x_forwarded_for;
}

map $request_method $login_limit_key {
    default "";
    POST    $client_address;
}

limit_req_zone $login_limit_key zone=login_per_ip:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Chỉ chuyển các header proxy mà ứng dụng cần. Không nhận Forwarded hoặc tiền tố URL từ client.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $client_address;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_set_header Forwarded "";

    location = /api/auth/login {
        limit_req zone=login_per_ip burst=4 nodelay;
        limit_req_status 429;
        error_page 429 = @login_rate_limited;
        proxy_pass http://backend:8080;
    }

    location @login_rate_limited {
        default_type application/problem+json;
        add_header Retry-After 12 always;
        add_header Cache-Control no-store always;
        return 429 '{"status":429,"code":"LOGIN_RATE_LIMITED"}';
    }

    location /api/ {
        proxy_pass http://backend:8080;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
