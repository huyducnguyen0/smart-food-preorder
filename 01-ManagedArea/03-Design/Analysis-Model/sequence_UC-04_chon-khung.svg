;"/><text x="771.978" y="256.535" fill="#000" font-size="12" font-weight="700">3</text><text x="782.651" y="256.535" fill="#000" font-size="12" textLength="193.436">điểm công việc hiện tại của các món</text><line x1="764.978" y1="290.266" x2="806.978" y2="290.266" style="stroke:#333;stroke-width:1;"/><line x1="806.978" y1="290.266" x2="806.978" y2="303.266" style="stroke:#333;stroke-width:1;"/><line x1="765.978" y1="303.266" x2="806.978" y2="303.266" style="stroke:#333;stroke-width:1;"/><polygon points="775.978,299.266,765.978,303.266,775.978,307.266,771.978,303.266" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="771.978" y="285.629" fill="#000" font-size="12" font-weight="700">4</text><text x="782.651" y="285.629" fill="#000" font-size="12" textLength="202.734">điểm giỏ = Σ điểm × số lượng (BR-08)</text><polygon points="1202.539,328.359,1212.539,332.359,1202.539,336.359,1206.539,332.359" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="764.978" y1="332.359" x2="1208.539" y2="332.359" style="stroke:#333;stroke-width:1;"/><text x="771.978" y="327.723" fill="#000" font-size="12" font-weight="700">5</text><text x="782.651" y="327.723" fill="#000" font-size="12" textLength="151.172">giờ mở cửa, quota mặc định</text><line x1="764.978" y1="376.547" x2="806.978" y2="376.547" style="stroke:#333;stroke-width:1;"/><line x1="806.978" y1="376.547" x2="806.978" y2="389.547" style="stroke:#333;stroke-width:1;"/><line x1="765.978" y1="389.547" x2="806.978" y2="389.547" style="stroke:#333;stroke-width:1;"/><polygon points="775.978,385.547,765.978,389.547,775.978,393.547,771.978,389.547" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="771.978" y="364.363" fill="#000" font-size="12" font-weight="700">6</text><text x="782.651" y="356.816" fill="#000" font-size="12" textLength="210.844">chia khung 15 phút hôm nay, giữ khung</tex