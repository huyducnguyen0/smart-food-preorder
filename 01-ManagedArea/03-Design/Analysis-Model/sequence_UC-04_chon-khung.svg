.578,31.013,665.578,41.013,669.578,37.013,665.578" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="35.013" y1="665.578" x2="382.319" y2="665.578" style="stroke:#333;stroke-width:1;"/><text x="47.013" y="660.941" fill="#000" font-size="12" textLength="13.348" font-weight="700">12</text><text x="64.36" y="660.941" fill="#000" font-size="12" textLength="311.959">báo đơn quá lớn cho một khung, liên hệ cửa hàng (BR-12)</text><line x1="14.013" y1="674.578" x2="672.333" y2="674.578" style="stroke:#777;stroke-width:1;stroke-dasharray:2,2;"/><text x="19.013" y="689.035" fill="#000" font-size="12" textLength="129.932" font-weight="700">[có khung "Đặt được"]</text><polygon points="41.013,726.859,31.013,730.859,41.013,734.859,37.013,730.859" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="35.013" y1="730.859" x2="382.319" y2="730.859" style="stroke:#333;stroke-width:1;"/><text x="47.013" y="718.676" fill="#000" font-size="12" textLength="13.348" font-weight="700">13</text><text x="64.36" y="711.129" fill="#000" font-size="12" textLength="297.299">hiển thị khung; khung "Không đủ chỗ" không chọn được</text><text x="64.36" y="726.223" fill="#000" font-size="12" textLength="195.451">(không hiển thị con số quota, BR-36)</text><polygon points="371.319,755.953,381.319,759.953,371.319,763.953,375.319,759.953" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="30.013" y1="759.953" x2="377.319" y2="759.953" style="stroke:#333;stroke-width:1;"/><text x="37.013" y="755.316" fill="#000" font-size="12" textLength="13.348" font-weight="700">14</text><text x="54.36" y="755.316" fill="#000" font-size="12" textLength="181.313">chọn khung, xem tóm tắt (bước 7)</text><line x1="383.319" y1="789.047" x2="425.319" y2="789.047" style="stroke:#333;stroke-width:1;"/><line x1="425.319" y1="789.047" x2="425.319" y2="802.047" style="stroke:#333;strok