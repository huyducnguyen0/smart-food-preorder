<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototype v2 — Đặt món trước (Sprint 1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Bảng màu v2 (UI-Prototype README mục 4). T-13 chép các biến này sang frontend/src/index.css. */
:root {
  --bg: #F7F5F2;
  --surface: #FFFFFF;
  --cream: #FFF4E6;
  --border: #ECE8E3;
  --ink: #1C1917;
  --ink-2: #57534E;
  --ink-3: #6D6661;
  --primary: #C2410C;
  --primary-hover: #9A3412;
  --primary-soft: #FFEDD5;
  --dark: #1F2A24;
  --success: #166534; --success-bg: #DCFCE7;
  --warning: #92400E; --warning-bg: #FEF3C7;
  --danger: #B91C1C;  --danger-bg: #FEE2E2;
  --info: #1D4ED8;    --info-bg: #DBEAFE;
  --neutral: #44403C; --neutral-bg: #F5F5F4;
  --radius: 16px;
  --shadow: 0 1px 2px rgba(28,25,23,.06), 0 4px 16px rgba(28,25,23,.06);
  font-family: 'Be Vietnam Pro', system-ui, 'Segoe UI', sans-serif;
  color: var(--ink);
  background: var(--bg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
body { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
a { color: var(--primary); }
img { display: block; }
.icon { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 8px; }

/* Khung ứng dụng của khách: một cột như app điện thoại, giữa màn hình trên máy tính */
.app { max-width: 520px; margin: 0 auto; min-height: 100vh; background: var(--surface); position: relative; padding-bottom: 150px; box-shadow: 0 0 0 1px var(--border); }
.app.wide { max-width: none; background: var(--bg); box-shadow: none; padding-bottom: 32px; }
.topbar { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.topbar h1 { font-size: 17px; margin: 0; flex: 1; font-weight: 700; }
.topbar .back { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; color: var(--ink); }
.topbar .back:hover { background: var(--neutral-bg); }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; text-decoration: none; color: var(--ink); }
.logo { width: 38px; height: 38px; border-radius: 12px; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 15px; letter-spacing: -.5px; flex: none; }
.brand b { display: block; font-size: 16px; line-height: 1.2; }
.brand small { display: flex; align-items: center; gap: 4px; color: var(--ink-3); font-size: 12px; }
.brand small .icon { width: 14px; height: 14px; }
.icon-btn { position: relative; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; color: var(--ink); }
.icon-btn:hover { background: var(--neutral-bg); }
.dot { position: absolute; top: 3px; right: 1px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 99px; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; border: 2px solid #fff; }
.link-btn { color: var(--primary); font-weight: 600; font-size: 14px; padding: 8px 4px; text-decoration: none; }

.content { padding: 16px; }
.section-title { font-size: 20px; font-weight: 800; margin: 24px 0 12px; letter-spacing: -.3px; scroll-margin-top: 130px; }
.muted { color: var(--ink-3); font-size: 14px; }

/* Banner */
.hero { position: relative; margin: 16px; border-radius: 20px; overflow: hidden; height: 168px; background: var(--dark); }
.hero img { width: 100%; height: 100%; object-fit: cover; opacity: .62; }
.hero div { position: absolute; inset: 0; padding: 20px; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; }
.hero strong { font-size: 24px; line-height: 1.15; font-weight: 800; letter-spacing: -.5px; }
.hero span { font-size: 14px; opacity: .92; margin-top: 4px; }

/* Nhóm món */
.chips { position: sticky; top: 63px; z-index: 15; background: var(--surface); display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; border-bottom: 1px solid var(--border); }
.chip { white-space: nowrap; padding: 8px 16px; border-radius: 99px; background: var(--neutral-bg); font-weight: 600; font-size: 14px; color: var(--ink-2); }
.chip.active { background: var(--ink); color: #fff; }

/* Món */
.item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); align-items: center; cursor: pointer; }
.item:last-child { border-bottom: 0; }
.thumb { width: 92px; height: 92px; border-radius: 16px; object-fit: cover; background: var(--cream); flex: none; }
.thumb.ph { display: grid; place-items: center; color: var(--primary); }
.thumb.ph .icon { width: 34px; height: 34px; stroke-width: 1.6; }
.item-body { flex: 1; min-width: 0; }
.item-body b { display: block; font-size: 16px; font-weight: 700; }
.item-body p { margin: 2px 0 6px; color: var(--ink-3); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.price { font-weight: 700; color: var(--primary); }
.add { width: 36px; height: 36px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; flex: none; }
.add:hover { background: var(--primary); color: #fff; }
.item.off { cursor: default; }
.item.off .thumb { filter: grayscale(1); opacity: .55; }
.item.off .price { color: var(--ink-3); }
.tag { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 99px; padding: 2px 10px; background: var(--neutral-bg); color: var(--neutral); }

/* Nút */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 99px; padding: 13px 22px; font-weight: 700; font-size: 15px; background: var(--neutral-bg); color: var(--ink); text-decoration: none; }
.btn:hover { background: var(--border); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-outline { background: transparent; box-shadow: inset 0 0 0 1.5px var(--border); }
.btn-block { width: 100%; }
.btn:disabled { background: var(--neutral-bg); color: #A8A29E; cursor: not-allowed; }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--neutral-bg); border-radius: 99px; padding: 3px; flex: none; }
.stepper button { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.stepper button .icon { width: 16px; height: 16px; }
.stepper span { min-width: 24px; text-align: center; font-weight: 700; }

/* Thanh giỏ hàng dính đáy + tab bar */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; pointer-events: none; }
.dock-inner { max-width: 520px; margin: 0 auto; pointer-events: auto; }
.cartbar { margin: 0 12px 10px; background: var(--dark); color: #fff; border-radius: 18px; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 18px; box-shadow: 0 8px 24px rgba(31,42,36,.35); }
.cartbar .meta { flex: 1; }
.cartbar .meta small { display: block; opacity: .75; font-size: 12px; }
.cartbar .meta b { font-size: 17px; }
.cartbar .btn { padding: 10px 18px; }
.tabbar { background: var(--surface); border-top: 1px solid var(--border); display: flex; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
.tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 12px; font-weight: 600; color: var(--ink-3); text-decoration: none; border-radius: 12px; }
.tabbar a.active { color: var(--primary); }
.bottom-cta { background: var(--surface); border-top: 1px solid var(--border); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }

/* Bảng thêm món (bottom sheet) */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(28,25,23,.45); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.sheet { width: 100%; max-width: 520px; background: var(--surface); border-radius: 24px 24px 0 0; max-height: 92vh; overflow: auto; animation: up .2s ease-out; }
.sheet .hero-img { width: 100%; height: 260px; object-fit: cover; }
.sheet .close { position: absolute; margin: 14px; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.92); display: grid; place-items: center; z-index: 1; }
.sheet-body { padding: 20px; }
.sheet-body h2 { margin: 0; font-size: 22px; font-weight: 800; }
.sheet-foot .btn { white-space: nowrap; padding: 13px 14px; }
.sheet-foot { display: flex; gap: 12px; align-items: center; padding: 12px 20px 20px; position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

/* Thẻ, thông báo */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.card.soft { background: var(--bg); border: 0; }
.alert { display: flex; gap: 10px; border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px; }
.alert .icon { margin-top: 1px; }
.alert ul { margin: 4px 0 0; padding-left: 18px; }
.alert-danger { background: var(--danger-bg); color: var(--danger); }
.alert-warning { background: var(--warning-bg); color: var(--warning); }
.alert-success { background: var(--success-bg); color: var(--success); }
.toast { position: fixed; left: 50%; top: 76px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow); animation: fade .2s; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.toast .icon { width: 18px; height: 18px; color: #86EFAC; }
.rows .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
.rows .row.total { border-top: 1px dashed #D6D3D1; margin-top: 6px; padding-top: 12px; font-weight: 800; font-size: 18px; }

/* Giỏ */
.cart-line { display: flex; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
.cart-line .thumb { width: 64px; height: 64px; border-radius: 12px; }
.cart-line .grow { flex: 1; min-width: 0; }
.cart-line b { display: block; font-size: 15px; }
.cart-line .remove { color: var(--ink-3); font-size: 13px; font-weight: 600; padding: 4px 0; }

/* Tiến trình đặt */
.steps { display: flex; gap: 6px; padding: 14px 16px 4px; }
.steps div { flex: 1; }
.steps i { display: block; height: 4px; border-radius: 4px; background: var(--border); margin-bottom: 6px; }
.steps .on i { background: var(--primary); }
.steps span { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.steps .on span { color: var(--ink); }

/* Khung giờ */
.hour { font-size: 13px; font-weight: 700; color: var(--ink-3); margin: 16px 0 8px; letter-spacing: .3px; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.slot { border-radius: 14px; padding: 10px 4px; text-align: center; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--border); }
.slot b { display: block; font-size: 16px; }
.slot small { font-size: 11px; font-weight: 600; color: var(--success); }
.slot:hover:not(:disabled) { box-shadow: inset 0 0 0 1.5px var(--primary); }
.slot.selected { background: var(--primary); box-shadow: none; color: #fff; }
.slot.selected small { color: #fff; }
.slot:disabled { background: var(--neutral-bg); box-shadow: none; color: var(--ink-3); cursor: not-allowed; }
.slot:disabled b { text-decoration: line-through; font-weight: 600; }
.slot:disabled small { color: var(--ink-3); }

/* Vé mã nhận */
.ticket { background: var(--dark); color: #fff; border-radius: 22px; padding: 22px; position: relative; overflow: hidden; }
.ticket .label { opacity: .75; font-size: 13px; }
.ticket .code { font-size: 44px; font-weight: 800; letter-spacing: 8px; font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; margin: 2px 0 6px; position: relative; z-index: 1; }
.ticket .when { display: flex; gap: 8px; align-items: center; font-weight: 600; position: relative; z-index: 1; }
.ticket .when .icon { width: 18px; height: 18px; }
.ticket::after { content: ''; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(194,65,12,.35); }
.track { display: flex; margin: 18px 0 4px; }
.track div { flex: 1; text-align: center; font-size: 12px; font-weight: 600; color: var(--ink-3); position: relative; }
.track div::before { content: ''; display: block; width: 14px; height: 14px; border-radius: 50%; margin: 0 auto 6px; background: var(--border); position: relative; z-index: 1; }
.track div:not(:first-child)::after { content: ''; position: absolute; top: 6px; right: 50%; width: 100%; height: 3px; background: var(--border); }
.track div.on { color: var(--ink); }
.track div.on::before, .track div.on::after { background: var(--primary); }

.badge { display: inline-block; border-radius: 99px; padding: 3px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.b-CONFIRMED { background: var(--info-bg); color: var(--info); }
.b-PREPARING { background: var(--warning-bg); color: var(--warning); }
.b-READY { background: var(--success-bg); color: var(--success); }
.b-PICKED_UP, .b-NO_SHOW { background: var(--neutral-bg); color: var(--neutral); }
.b-CANCELLED { background: var(--danger-bg); color: var(--danger); }

.seg { display: flex; background: var(--neutral-bg); border-radius: 99px; padding: 4px; margin: 4px 0 14px; }
.seg button { flex: 1; padding: 8px; border-radius: 99px; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.order-card { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; cursor: pointer; }
.order-card:hover { border-color: var(--ink-3); }
.order-card .thumb { width: 64px; height: 64px; border-radius: 12px; }
.order-card .code-s { font-family: ui-monospace, Consolas, monospace; font-weight: 800; font-size: 17px; letter-spacing: 2px; }
.order-card .grow { flex: 1; min-width: 0; }
.order-card .muted { display: flex; gap: 4px; align-items: center; font-size: 13px; }
.order-card .muted .icon { width: 14px; height: 14px; }

/* Đăng nhập */
.login-hero { height: 220px; position: relative; }
.login-hero img { width: 100%; height: 100%; object-fit: cover; }
.login-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0) 40%, #fff 100%); }
.field { display: block; margin-bottom: 14px; }
.field span { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.field input { width: 100%; font: inherit; padding: 13px 16px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface); }
.field input:focus { border-color: var(--primary); outline: none; }

/* Bếp */
.k-top { background: var(--dark); color: #fff; }
.k-top-inner { max-width: 1240px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.k-top h1 { margin: 0; font-size: 20px; flex: 1; white-space: nowrap; }
.k-top .clock { opacity: .85; font-size: 14px; display: flex; gap: 6px; align-items: center; }
.k-top .btn { padding: 9px 16px; background: rgba(255,255,255,.12); color: #fff; }
.board { max-width: 1240px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
.col h2 { display: flex; align-items: center; gap: 8px; font-size: 16px; margin: 0 0 12px; }
.col h2 i { width: 10px; height: 10px; border-radius: 50%; }
.col h2 em { font-style: normal; background: var(--surface); border-radius: 99px; padding: 0 9px; font-size: 13px; }
.k-card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); border-top: 4px solid var(--border); }
.k-card.g-PREP { border-top-color: #D97706; }
.k-card.g-DUE { border-top-color: var(--primary); }
.k-card.g-UP { border-top-color: #A8A29E; }
.k-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.k-code { font-family: ui-monospace, Consolas, monospace; font-weight: 800; font-size: 22px; letter-spacing: 2px; }
.k-time { font-weight: 700; background: var(--neutral-bg); border-radius: 10px; padding: 3px 10px; white-space: nowrap; }
.late { background: var(--danger); color: #fff; border-radius: 8px; padding: 2px 8px; font-size: 12px; font-weight: 800; letter-spacing: .5px; }
.k-card ul { list-style: none; padding: 0; margin: 12px 0; font-size: 17px; font-weight: 600; }
.k-card li { padding: 4px 0; }
.k-card li b { display: inline-block; min-width: 34px; color: var(--primary); }
.k-meta { color: var(--ink-3); font-size: 13px; margin-top: 6px; }
.k-card .btn { width: 100%; padding: 12px; }
.empty { text-align: center; padding: 48px 16px; color: var(--ink-3); }
.empty .icon { width: 48px; height: 48px; stroke-width: 1.4; margin: 0 auto 10px; color: #D6D3D1; display: block; }

/* Bảng điều khiển prototype (không thuộc giao diện thật) */
.demo-toggle { position: fixed; left: 12px; bottom: 160px; z-index: 40; background: #111827; color: #fff; border-radius: 99px; padding: 6px 12px; font-size: 12px; font-weight: 700; box-shadow: var(--shadow); opacity: .85; }
.demo { position: fixed; left: 12px; bottom: 200px; z-index: 40; width: 270px; background: #111827; color: #F9FAFB; border-radius: 14px; padding: 14px; font-size: 13px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.demo.open { display: block; }
.demo label { display: block; margin-bottom: 8px; }
.demo select { width: 100%; font: inherit; font-size: 13px; margin-top: 2px; padding: 4px; border-radius: 6px; }
.demo p { margin: 0 0 10px; opacity: .7; }

@media (max-width: 860px) { .board { grid-template-columns: 1fr; } .k-top .clock { order: 5; width: 100%; } }
@media (max-width: 380px) { .slots { grid-template-columns: repeat(3, 1fr); } .thumb { width: 78px; height: 78px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<button class="demo-toggle" id="demoToggle" aria-expanded="false">⚙ Prototype</button>
<div class="demo" id="demo" aria-label="Điều khiển prototype, không thuộc giao diện thật">
  <p>Bảng điều khiển của prototype, dữ liệu giả. Không thuộc giao diện thật.</p>
  <label>Vai trò
    <select id="role"><option value="guest">Khách vãng lai</option><option value="CUSTOMER" selected>Khách</option><option value="KITCHEN">Nhân viên bếp</option></select></label>
  <label>Danh sách khung
    <select id="slotCase"><option value="ok">Bình thường</option><option value="E2">E2 hết khung trong ngày</option><option value="E3">E3 mọi khung không đủ chỗ</option><option value="E4">E4 đơn quá lớn</option></select></label>
  <label>Kết quả gửi đơn
    <select id="submitCase"><option value="ok">Thành công</option><option value="E5">E5 đủ 3 đơn</option><option value="E6">E6 khung hết hạn</option><option value="E7">E7 món thay đổi</option><option value="E8">E8 khung vừa hết chỗ</option><option value="E9">E9 đơn quá lớn</option><option value="E10">E10 lỗi hệ thống</option></select></label>
  <label>Hàng chờ bếp
    <select id="kitchenCase"><option value="ok">Có đơn</option><option value="empty">Trống (A1)</option></select></label>
</div>

<div id="root"></div>

<script>
// Ảnh món: Unsplash (giấy phép Unsplash, dùng tự do), chỉ để minh họa trong prototype.
const IMG = (id, w = 400) => `https://images.unsplash.com/photo-${id}?w=${w}&h=${w}&fit=crop&q=70&auto=format`;
const ICONS = {
  plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>', back: '<path d="m15 18-6-6 6-6"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  menu: '<path d="M4 7h16M4 12h16M4 17h10"/>', receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', walk: '<circle cx="13" cy="4" r="2"/><path d="M10 22l2-7 3 3v6M8 12l2-4 4 1 3 3"/>',
  check: '<path d="M20 6 9 17l-5-5"/>', alert: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>',
  refresh: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>', bag: '<path d="M5 8h14l-1 13H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>',

    ${fresh ? alertBox('success', '<b>Cửa hàng đã nhận đơn của bạn.</b> Đến quầy đúng giờ và đọc mã nhận.') : ''}

    <h2 class="section-title">Món đã đặt</h2>
    ${o.lines.map((l) => { const i = itemOf(l.id); return `<div class="cart-line">${thumb(i)}<div class="grow"><b>${i.name}</b><span class="muted">${l.qty} × ${money(l.price)}</span></div><b>${money(l.qty * l.price)}</b></div>`; }).join('')}
    <div class="card soft rows" style="margin-top:16px">

function guard(path) {
  const needCustomer = path === '/cart' || path === '/checkout' || path.startsWith('/orders');
  if ((needCustomer || path === '/kitchen') && role() === 'guest') return '/login';
  if (needCustomer && role() !== 'CUSTOMER') return '/forbidden';
  if (path === '/kitchen' && role() !== 'KITCHEN') return '/forbidden';
  return null;
}

function render() {
  let path = location.hash.slice(1) || '/';
  if (path === '/logout') { $('role').value = 'guest'; state.notice = null; go('/'); return; }
  if (role() === 'KITCHEN' && path === '/') path = '/kitchen';
  const redirect = guard(path);
  if (redirect) { path = redirect; history.replaceState(null, '', '#' + redirect); }
  const m = path.match(/^\/orders\/(\d+)(\?new)?$/);
  const body = m ? orderDetail(Number(m[1]), !!m[2]) : (pages[path] || pages['/'])();
  const withDock = role() !== 'KITCHEN' && (['/', '/orders', '/login', '/forbidden'].includes(path) || m);
  $('root').innerHTML = `<div class="app ${path === '/kitchen' ? 'wide' : ''}">${body}</div>${withDock ? dock(m ? '/orders' : path) : ''}${state.sheet ? sheet() : ''}${state.toast ? `<div class="toast" role="status">${ic('check')}${state.toast}</div>` : ''}`;
}

function addToCart(id, qty) {
  const line = state.cart.find((l) => l.id === id);
  if (line) line.qty += qty; else state.cart.push({ id, qty, price: itemOf(id).price });
  state.sheet = null; toast(`Đã thêm ${qty} ${itemOf(id).name}`);
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-open], [data-order], [data-closesheet]');
  if (!t) return;
  const d = t.dataset;
  if (d.closesheet) { if (e.target === t || t.tagName === 'BUTTON') { state.sheet = null; render(); } return; }
  if (d.quick || d.open) {
    if (role() === 'guest') { go('/login'); return; } // UC-03 A3: món chưa được thêm
    if (d.quick) addToCart(Number(d.quick), 1); else { state.sheet = { id: Number(d.open), qty: 1 }; render(); }
    return;
  }
  if (d.sinc) { state.sheet.qty += 1; render(); }
  if (d.sdec) { if (state.sheet.qty > 1) state.sheet.qty -= 1; render(); }
  if (d.sadd) addToCart(state.sheet.id, state.sheet.qty);
  if (d.cat) { state.category = d.cat; render(); $('cat-' + d.cat)?.scrollIntoView({ behavior: 'smooth' }); }
  if (d.inc) { state.cart.find((l) => l.id === Number(d.inc)).qty += 1; render(); }
  if (d.dec) { const l = state.cart.find((x) => x.id === Number(d.dec)); if (l.qty > 1) l.qty -= 1; render(); }
  if (d.del) { state.cart = state.cart.filter((l) => l.id !== Number(d.del)); render(); }
  if (d.go) { state.notice = null; if (location.hash === '#' + d.go) render(); else go(d.go); }
  if (d.slot) { state.slot = d.slot; render(); }
  if (d.tab) { state.orderTab = d.tab; render(); }
  if (d.order) go('/orders/' + d.order);
  if (t.id === 'doLogin') {
    if (!$('password').value) { state.loginError = 'Thông tin đăng nhập không đúng.'; render(); return; }
    state.loginError = null;
    if (role() === 'guest') $('role').value = 'CUSTOMER';
    go(role() === 'KITCHEN' ? '/kitchen' : '/');
  }
  if (t.id === 'submit') submit();
  if (d.start || d.done) {
    const o = state.kitchen.find((x) => x.code === (d.start || d.done));
    o.status = d.start ? 'PREPARING' : 'READY';
    toast(d.start ? `Đã bắt đầu ${o.code}` : `${o.code} sẵn sàng, đã rời hàng chờ`);
  }
});

function submit() {
  const c = $('submitCase').value;
  const msgs = {
    E5: 'Bạn đang có 3 đơn chưa hoàn tất nên chưa đặt thêm được. Xem ở <a href="#/orders">Đơn của tôi</a>. Giỏ hàng vẫn được giữ.',
    E6: 'Khung bạn chọn không còn đặt được (cần đặt trước ít nhất 30 phút). Danh sách đã cập nhật, vui lòng chọn lại.',
    E8: 'Khung bạn chọn vừa hết chỗ. Danh sách đã cập nhật, vui lòng chọn khung khác.',
    E10: 'Có lỗi hệ thống, đơn chưa được tạo. Bạn có thể bấm đặt lại; hệ thống không tạo trùng đơn.',
  };
  if (msgs[c]) { state.notice = msgs[c]; if (c === 'E6' || c === 'E8') state.slot = null; render(); window.scrollTo(0, 0); return; }
  if (c === 'E7') {
    const l = state.cart.find((x) => x.id === 12); if (l) l.price = 47000;
    state.notice = 'Một số món đã thay đổi, vui lòng xem lại rồi đặt lại:<ul><li>Burger bò: giá mới 47.000đ</li></ul>';
    go('/cart'); return;
  }
  if (c === 'E9') { state.notice = 'Đơn quá lớn cho một khung giờ. Vui lòng bớt món hoặc liên hệ cửa hàng.'; go('/cart'); return; }
  const id = 41;
  state.orders = state.orders.filter((o) => o.id !== id);
  state.orders.push({ id, code: 'K7M3QX', slot: state.slot, date: 'Hôm nay', status: 'CONFIRMED', paid: false, at: '10:52', lines: state.cart.map((l) => ({ ...l })) });
  state.cart = []; state.slot = null; state.notice = null;
  go(`/orders/${id}?new`);
}

$('demoToggle').addEventListener('click', () => { const open = $('demo').classList.toggle('open'); $('demoToggle').setAttribute('aria-expanded', String(open)); });
['role', 'slotCase', 'kitchenCase'].forEach((id) => $(id).addEventListener('change', () => { state.notice = null; state.sheet = null; render(); }));
window.addEventListener('hashchange', () => { if (!location.hash.startsWith('#/cart') && !location.hash.startsWith('#/checkout')) state.notice = null; state.sheet = null; render(); window.scrollTo(0, 0); });
render();
</script>
</body>
</html>
